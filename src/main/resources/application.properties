spring.application.name=service-notification
server.port=8082

# Config Server - Desabilitado para evitar falhas de conexão
# spring.cloud.config.uri=http://localhost:8888/config
# spring.config.import=configserver:http://localhost:8888/config
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8888/eureka/
eureka.instance.prefer-ip-address=true

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



